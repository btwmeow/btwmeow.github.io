<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — Памятка ВК ВСРО</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="site-header">
        <h1 class="site-title">Памятка Военного Комиссариата ВСРО</h1>
        <p class="site-subtitle">Официальный информационный портал</p>
    </header>

    <!-- Основной контент ошибки -->
    <main class="container">
        <div class="content-block error-block">
            <div class="error-code">404</div>
            <h2 class="error-title">Документ не найден или засекречен</h2>
            <p class="error-description">
                Запрашиваемый регламент, раздел или методическое указание отсутствует на сервере Военного Комиссариата. Возможно, файл был перемещен или адрес указан неверно.
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn-error-home">Вернуться на главную</a>
            </div>
        </div>
    </main>

</body>
</html>
